schema_version: "1.1"
name: config-lens-off
description: A lens that the review config turns off does not run, and the summary names it with "disabled by config".
tags: [config]
context:
  scaffold_script: fixture.sh
execution:
  model: claude-sonnet-5-5
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Bash]
  prompt: /daedalus-core:code-review --spec none
graders:
  - name: lens-disabled-by-config
    type: regex
    pattern: "Lenses skipped: [^\\n]*\\berror-handling \\(disabled by config\\)"
  - name: lens-not-run
    type: regex
    pattern: "Lenses run: (?:(?!error-handling)[^\\n])*?\\. Lenses skipped"
  - name: config-named
    type: regex
    pattern: "Config: `?docs/agents/code-review\\.md"
