schema_version: "1.1"
name: clean-change
description: A correct change produces no blocking finding.
tags: [correctness, precision]
context:
  scaffold_script: fixture.sh
execution:
  model: claude-sonnet-5-5
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Bash]
  prompt: /daedalus-core:code-review
graders:
  - name: not-blocking
    type: regex
    pattern: "\\*\\*Verdict: NOT BLOCKING\\*\\*"
  - name: skipped-lenses-with-reasons
    type: regex
    pattern: "Lenses skipped: [^\\n]*security[^\\n]*\\(not available in this version\\)"
