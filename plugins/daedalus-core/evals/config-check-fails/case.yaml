schema_version: "1.1"
name: config-check-fails
description: A check command from the review config that fails is quoted in the report's Checks section and named in the summary line.
tags: [config, checks]
context:
  scaffold_script: fixture.sh
execution:
  model: claude-sonnet-5-5
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Bash]
  prompt: /daedalus-core:code-review --spec none
graders:
  - name: failure-quoted-as-evidence
    type: regex
    pattern: "### Checks\\s+- `python3 -B -m unittest discover -s tests -t \\.`: FAIL[\\s\\S]*?6\\.0 != 3"
  - name: failure-in-summary
    type: regex
    pattern: "### Summary[\\s\\S]*Checks: [^\\n]*python3 -B -m unittest[^\\n]*\\bFAIL\\b"
  - name: finding-at-seeded-line
    type: regex
    pattern: "\\*\\*[CH]\\d+ — [^\\n]*\\n- Location: `src/stats\\.py:(?:\\d+-)?13\\b"
  - name: finders-ran
    type: tool_used
    tool: Agent
    min: 5
