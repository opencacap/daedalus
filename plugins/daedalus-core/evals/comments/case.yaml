schema_version: "1.1"
name: comments
description: The comments lens reports a docstring that promises a KeyError the code never raises, at M, without blocking.
tags: [comments]
context:
  scaffold_script: fixture.sh
execution:
  model: claude-sonnet-5-5
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Bash]
  prompt: /daedalus-core:code-review --spec none
graders:
  - name: finding-at-docstring
    type: regex
    pattern: "\\*\\*M\\d+ — [^\\n]*\\n- Location: `src/directory\\.py:(?:\\d+-)?(?:4|5)\\b"
  - name: found-by-comments-lens
    type: regex
    pattern: "- Location: `src/directory\\.py:(?:\\d+-)?(?:4|5)\\b[^\\n]*\\n- Lenses: [^\\n]*\\bcomments\\b"
  - name: verified
    type: regex
    pattern: "- Location: `src/directory\\.py:(?:\\d+-)?(?:4|5)\\b[^\\n]*(?:\\n- [^\\n]*)*?\\n- Verifier: CONFIRMED"
  - name: not-blocking
    type: regex
    pattern: "\\*\\*Verdict: NOT BLOCKING\\*\\*"
