schema_version: "1.1"
name: duplicate
description: With a named base, a bug that both correctness passes find appears once in the report and lists both passes.
tags: [correctness, normalize]
context:
  scaffold_script: fixture.sh
execution:
  model: claude-sonnet-5-5
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Bash]
  prompt: /daedalus-core:code-review main
graders:
  - name: one-finding-at-location
    type: regex
    pattern: "^- Location: `src/tokens\\.py:(?:\\d+-)?9`"
    flags: m
    match: "count:1"
  - name: both-passes-listed
    type: regex
    pattern: "Lenses: (?:correctness-a, correctness-b|correctness-b, correctness-a)"
