schema_version: "1.1"
name: error-handling
description: The error-handling lens reports a write failure that is swallowed and reported as success, as a blocking C or H finding.
tags: [error-handling]
context:
  scaffold_script: fixture.sh
execution:
  model: claude-sonnet-5-5
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Bash]
  prompt: /daedalus-core:code-review --spec none
graders:
  - name: finding-at-seeded-lines
    type: regex
    pattern: "\\*\\*[CH]\\d+ — [^\\n]*\\n- Location: `src/orders\\.py:(?:\\d+-)?(?:10|11|12)\\b"
  - name: found-by-error-handling-lens
    type: regex
    pattern: "- Location: `src/orders\\.py:(?:\\d+-)?(?:10|11|12)\\b[^\\n]*\\n- Lenses: [^\\n]*\\berror-handling\\b"
  - name: blocking
    type: regex
    pattern: "\\*\\*Verdict: BLOCKING\\*\\*"
  - name: verified
    type: regex
    pattern: "- Location: `src/orders\\.py:(?:\\d+-)?(?:10|11|12)\\b[^\\n]*(?:\\n- [^\\n]*)*?\\n- Verifier: CONFIRMED"
