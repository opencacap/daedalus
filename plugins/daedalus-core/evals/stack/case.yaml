schema_version: "1.1"
name: stack
description: With daedalus-python installed, the stack lens reports a mutable default argument against python-patterns as a blocking C or H finding and cites the skill.
tags: [stack]
# run.sh copies plugins/daedalus-python into this case directory; plugins entries must sit under the plugin being evaluated.
plugins: ["../..", "daedalus-python"]
context:
  scaffold_script: fixture.sh
execution:
  model: claude-sonnet-5-5
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Bash]
  prompt: /daedalus-core:code-review --spec none
graders:
  - name: finding-at-seeded-line
    type: regex
    pattern: "\\*\\*[CH]\\d+ — [^\\n]*\\n- Location: `src/tags\\.py:(?:\\d+-)?4\\b"
  - name: found-by-stack-lens-with-rule
    type: regex
    pattern: "- Location: `src/tags\\.py:(?:\\d+-)?4\\b[^\\n]*\\n- Lenses: [^\\n]*\\bstack\\b(?:\\n- [^\\n]*)*?\\n- Rule: [^\\n]*python-patterns"
  - name: blocking
    type: regex
    pattern: "\\*\\*Verdict: BLOCKING\\*\\*"
