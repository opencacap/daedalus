schema_version: "1.1"
name: config-do-not-report
description: A defect on the review config's "Do not report" list does not appear in the report.
tags: [config, precision]
context:
  scaffold_script: fixture.sh
execution:
  model: claude-sonnet-5-5
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Bash]
  prompt: /daedalus-core:code-review --spec none
graders:
  - name: listed-defect-not-reported
    type: regex
    pattern: "- Location: `src/stats\\.py:(?:\\d+-)?1[0-3]\\b"
    match: not_contains
  - name: not-blocking
    type: regex
    pattern: "\\*\\*Verdict: NOT BLOCKING\\*\\*"
