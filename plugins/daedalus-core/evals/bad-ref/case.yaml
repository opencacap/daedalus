schema_version: "1.1"
name: bad-ref
description: A base ref that does not resolve stops the review before any sub-agent starts.
tags: [scope]
context:
  scaffold_script: fixture.sh
execution:
  model: claude-sonnet-5-5
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Bash]
  prompt: /daedalus-core:code-review no-such-ref
graders:
  - name: stops-with-message
    type: regex
    pattern: "Review stopped: base ref .?no-such-ref.? does not resolve"
  - name: no-sub-agent
    type: tool_used
    tool: Agent
    min: 0
    max: 0
