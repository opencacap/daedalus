schema_version: "1.1"
name: spec-ask
description: With no spec argument and no spec found, the review asks the developer where the spec is before any sub-agent starts.
tags: [spec, context]
context:
  scaffold_script: fixture.sh
execution:
  model: claude-sonnet-5-5
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Bash]
  prompt: /daedalus-core:code-review
graders:
  - name: asks-for-spec
    type: regex
    pattern: "Where is the spec for this change\\?"
  - name: no-sub-agent
    type: tool_used
    tool: Agent
    min: 0
    max: 0
